name: Native portable packages
on:
  workflow_dispatch:
  push:
    branches: [codex/headcam-companion-support, codex/live-camera-inspection]
    paths: ['tools/native/**', 'tools/force/**', 'tools/release.py', 'docs/**', 'tests/test_native_force.py', 'src/**', 'vendor/force/**', '.github/workflows/native-portable.yml', 'package*.json']
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {os: ubuntu-22.04, label: linux-x64}
          - {os: windows-2022, label: windows-x64}
          - {os: macos-15-intel, label: macos-x64}
          - {os: macos-15, label: macos-arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc diffutils
          path-type: inherit
      - run: python -m pip install -r tools/native/requirements.txt
      - run: npm ci
      - run: npm test
      - run: npm run test:python
      - run: npm run build
      - run: python tools/release.py
      - run: python tools/native/build-ffmpeg.py
        if: runner.os != 'Windows'
      - run: python tools/native/build-ffmpeg.py
        if: runner.os == 'Windows'
        shell: msys2 {0}
      - run: python tools/native/build.py
      - name: Extract and check the portable Start Viewer entry point
        run: python tools/native/check-startup.py "dist/RobotDataViewer-$(node -p 'require("./package.json").version')-${{ matrix.label }}.zip" --output artifacts/native-startup-${{ matrix.label }}.json
      - run: python tools/native/ci-smoke.py ${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: RobotDataViewer-${{ matrix.label }}
          path: dist/RobotDataViewer-*.zip*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: native-smoke-${{ matrix.label }}
          path: |
            artifacts/native-smoke-*.json
            artifacts/native-startup-*.json
  nvidia:
    needs: portable
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {os: ubuntu-22.04, label: linux-x64}
          - {os: windows-2022, label: windows-x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          name: RobotDataViewer-${{ matrix.label }}
          path: dist
      - run: |
          python -m pip install -r tools/native/requirements-nvidia.txt
          python -c "import pathlib,zipfile; z=zipfile.ZipFile(next(pathlib.Path('dist').glob('*-${{ matrix.label }}.zip'))); [pathlib.Path('sources',pathlib.PurePosixPath(n).name).write_bytes(z.read(n)) for n in z.namelist() if n.startswith('RobotDataViewer/sources/') and not n.endswith('/')]"
          python tools/native/build.py --nvidia
          python tools/native/ci-smoke.py ${{ matrix.label }} --addon
      - uses: actions/upload-artifact@v4
        with:
          name: RobotDataViewer-${{ matrix.label }}-nvidia
          path: dist/*nvidia.zip*
          if-no-files-found: error
