name: Native portable packages
on:
  workflow_dispatch:
    inputs:
      build_nvidia:
        description: Also rebuild optional NVIDIA add-ons
        type: boolean
        default: false
  push:
    branches: [codex/headcam-companion-support, codex/live-camera-inspection]
    paths: ['tools/**', 'docs/**', 'tests/**', 'src/**', 'vendor/force/**', '.github/workflows/native-portable.yml', 'package*.json']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 tools/release.py
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-build-input
          path: |
            dist/viewer.html
            dist/force-runtime.js
            dist/BUILD.json
            dist/RobotDataViewer.zip
            sources/RobotDataViewer-source.tar.gz
          if-no-files-found: error
  portable:
    needs: web
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {os: ubuntu-22.04, label: linux-x64}
          - {os: windows-2022, label: windows-x64}
          - {os: macos-15-intel, label: macos-x64}
          - {os: macos-15, label: macos-arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install desktop test display and Tcl/Tk
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth tk
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc diffutils
          path-type: inherit
      - run: python -m pip install -r tools/native/requirements.txt
      - run: npm ci
      - run: npm test
      - run: npm run test:python
      - uses: actions/download-artifact@v4
        with:
          name: viewer-build-input
          path: .
      - run: python tools/native/build-ffmpeg.py
        if: runner.os != 'Windows'
      - run: python tools/native/build-ffmpeg.py
        if: runner.os == 'Windows'
        shell: msys2 {0}
      - run: python tools/native/build.py
      - uses: browser-actions/setup-chrome@v2
        if: runner.os != 'macOS'
        id: chrome
      - name: Extract and check the portable Start Viewer entry point
        env:
          ROBOT_VIEWER_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          runner=()
          if [ "$RUNNER_OS" = Linux ]; then runner=(xvfb-run -a); fi
          "${runner[@]}" python tools/native/check-startup.py "dist/RobotDataViewer-$(node -p 'require("./package.json").version')-${{ matrix.label }}.zip" --output artifacts/native-startup-${{ matrix.label }}.json --camera-output artifacts/native-cameras-${{ matrix.label }}.json
      - name: Verify desktop and browser shutdown lifecycle
        env:
          ROBOT_VIEWER_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          runner=()
          if [ "$RUNNER_OS" = Linux ]; then runner=(xvfb-run -a); fi
          "${runner[@]}" python tools/native/check-lifecycle.py "dist/RobotDataViewer-$(node -p 'require("./package.json").version')-${{ matrix.label }}.zip" --output artifacts/native-lifecycle-${{ matrix.label }}.json
      - run: python tools/native/ci-smoke.py ${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: RobotDataViewer-html
          path: dist/RobotDataViewer.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: RobotDataViewer-${{ matrix.label }}
          path: dist/RobotDataViewer-*.zip*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke-${{ matrix.label }}
          path: |
            artifacts/native-smoke-*.json
            artifacts/native-startup-*.json
            artifacts/native-cameras-*.json
            artifacts/native-lifecycle-*.json
  release-set:
    needs: portable
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          pattern: RobotDataViewer-*
          path: artifacts/release-input
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: native-smoke-*
          path: artifacts/release-reports
          merge-multiple: true
      - name: Verify every platform and assemble matching source and checksums
        run: python tools/verify_release.py --directory artifacts/release-input --reports artifacts/release-reports --output artifacts/release-ready
      - uses: actions/upload-artifact@v4
        with:
          name: release-ready
          path: artifacts/release-ready/*
          if-no-files-found: error
  nvidia:
    needs: portable
    if: github.event_name == 'workflow_dispatch' && inputs.build_nvidia
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {os: ubuntu-22.04, label: linux-x64}
          - {os: windows-2022, label: windows-x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          name: RobotDataViewer-${{ matrix.label }}
          path: dist
      - run: |
          python -m pip install -r tools/native/requirements-nvidia.txt
          python -c "import pathlib,zipfile; z=zipfile.ZipFile(next(pathlib.Path('dist').glob('*-${{ matrix.label }}.zip'))); [pathlib.Path('sources',pathlib.PurePosixPath(n).name).write_bytes(z.read(n)) for n in z.namelist() if n.startswith('RobotDataViewer/sources/') and not n.endswith('/')]"
          python tools/native/build.py --nvidia
          python tools/native/ci-smoke.py ${{ matrix.label }} --addon
      - uses: actions/upload-artifact@v4
        with:
          name: RobotDataViewer-${{ matrix.label }}-nvidia
          path: dist/*nvidia.zip*
          if-no-files-found: error
