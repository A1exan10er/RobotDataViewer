name: Live camera regression
on:
  workflow_dispatch:
  push:
    branches: [codex/live-camera-inspection]
  pull_request:
permissions:
  contents: read
jobs:
  live-cameras:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Simulated camera browser checks
        run: npm run test:live
      - name: Chrome camera controls (pointer and keyboard)
        run: node tools/browser-camera-controls.mjs
      - name: Firefox camera controls (pointer and keyboard)
        if: runner.os == 'Linux'
        run: node tools/browser-camera-controls.mjs --firefox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-camera-checks-${{ matrix.os }}
          path: |
            artifacts/live-camera-browser/
            artifacts/camera-controls/
